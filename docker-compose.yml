services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Uses the example file so a fresh clone starts without extra setup.
    env_file: .env.example
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
